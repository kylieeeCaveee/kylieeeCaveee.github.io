<!DOCTYPE html> 
<html> 
    <head> 
        <title> Paragraph Practice</title>
    </head>
    <body> 
        <p> This is a paragraph.</p>
        <p> This is a second paragraph. </p>
        <!-- The browser automatically removes any extra spaces and lines when the page is displayed, and the size depends on the size of the webpage-->
        <p> there will be a line under this content </p>
        <hr> 
        <!-- use hr to make a horizontal line to distinguish content -->
        <p> there will be a line above this content</p>
        <p> This paragraph has a <br> break in the middle </p>
        <!-- br= line break -->
        <!-- pre = formats text to preserve spaces and line breaks-->
        <pre>
            I 

            want 

            a 

            lot 

            of 

            space 

            here
        </pre>

    </body>
</html>
