<!DOCTYPE html> 
<html> 
    <head> 
        <title> Lisrs Practice</title>
    </head>
    <body> 
        <!-- each table cell is td -->
         <!-- -->
        <table>
            <tr> 
                <td> one</td>
                <td> two</td>
                <td> three</td>
            </tr>
        </table>

        <table> 
            <tr> 
                <td> one</td>
                <td> two</td>
                <td> three</td>
            </tr>
            <tr> 
                <td> 1.1</td>
                <td> 2.1</td>
                <td> 3.1</td>
            </tr>
            <tr> 
                <td> 1.2</td>
                <td> 2.2</td>
                <td> 3.2</td>
            </tr>

        </table>
        <!-- table headers use th -->
        <table> 

            <tr> 
                <th> column 1 </th>
                <th> column 2 </th>
                <th> column 3 </th>
            </tr>
            <tr> 
                <td> one</td>
                <td> two</td>
                <td> three</td>
            </tr>
            <tr> 
                <td> 1.1</td>
                <td> 2.1</td>
                <td> 3.1</td>
            </tr>
            <tr> 
                <td> 1.2</td>
                <td> 2.2</td>
                <td> 3.2</td>
            </tr>
        </table>



    </body>
</html>
