<!DOCTYPE html> 
<html> 
    <head> 
        <title> Lisrs Practice</title>
    </head>
    <body> 
        <!-- unordered lists use ul and each item uses li-->
         <ul> 
            <li> Julien Baker </li>
            <li>  Lucy Dacus</li>
            <li> Phoebe Bridgers</li>
         </ul>

         <!-- ordered lists use ol and and li-->

        <ol> 
            <li> Julien Baker</li>
            <li> Lucy Dacus </li>
            <li> Phoebe Bridgers </li>
        </ol>

        <!-- dl is a description list with dt is the term and dd is the description-->
         <dl> 
            <dt>Julien Baker</dt>
            <dd> -The shortest member of boygenius</dd>
            <dt> Phoebe Bridgers</dt>
            <dd> -The blondest member of boygenius</dd>
            <dt> Lucy Dacus</dt>
            <dd> -The happiest member of boygenius</dd>
         </dl>

    </body>
</html>
