<!DOCTYPE html>
<html>
<body>

<h2>JavaScript addEventListener()</h2>

<p>This example uses the addEventListener() method to add two click events to the same button.</p>

<button id="myBtn">Try it</button>

<script>
var x = document.getElementById("myBtn");
x.addEventListener("click", myFunction);
x.addEventListener("click", someOtherFunction);

function myFunction() {
  alert ("Hello World!");
}

function someOtherFunction() {
  alert ("This function was also executed!");
}
</script>

<p>This example uses the addEventListener() method to add many events on the same button.</p>

<button id="myBtnTwo">Try it</button>

<p id="demoTwo"></p>

<script>
var x = document.getElementById("myBtnTwo");
x.addEventListener("mouseover", myFunction);
x.addEventListener("click", mySecondFunction);
x.addEventListener("mouseout", myThirdFunction);

function myFunction() {
  document.getElementById("demoTwo").innerHTML += "Moused over!<br>";
}

function mySecondFunction() {
  document.getElementById("demoTwo").innerHTML += "Clicked!<br>";
}

function myThirdFunction() {
  document.getElementById("demoTwo").innerHTML += "Moused out!<br>";
}
</script>


</body>
</html>
