<!DOCTYPE html>
<html>
    <head>
        <title>Class Tutorial</title>
        <style> 
            .categoryOne{
                background-color: red;
                color: white; 
            }
            .categoryTwo{
                background-color: blue;
                color: white;
            }
            .important{
                font-size: 150%;
                font-weight: bold;
                font-style:italic; 
                color:red; 
            }
        </style>
    </head>
    <body>
        <div class="categoryOne">
            <p>This is a category One.</p>

        </div>
        <div class="categoryTwo">
            <p>This is a category two.</p>
        </div>
        <div class="categoryOne">
            <p>This is also a category one.</p>
        </div>

        <p> This is some <span class="important"> important </span> text.</span> It uses the span header with the <span class="important"> important </span> to make the changes to font size. </p>
        <div class="categoryTwo important">
            <p>This is a category two important div.</p>
        </div>
        <p class="categoryOne"> This is a category one paragraph instead of a div.</p>
        <!--See java script tutorial for more examples of class work using javascript-->
    </body>
</html>
