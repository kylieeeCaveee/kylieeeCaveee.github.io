<!DOCTYPE html>
<html>
    <head>
        <title> Accordion Button Tutorial</title>
        <link rel="stylesheet" href="CSS/accordionButton.css">
        <script src="JS/accordionButton.js" defer></script>

    </head>
    <body>
        <h1> Accordion button tutorial</h1>
        <button class="accordion">Name</button>
        <div class="panel">
            <p>Kylie Cave</p>
        </div>

        <button class="accordion">Hometown</button>
        <div class="panel">
            <p> San Antonio, Texas</p>
        </div>

        <button class="accordion">School</button>
        <div class="panel">
            <p>Keystone School and Smith College</p>
        </div>  
    </body>
</html>
